services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_tracking}
      POSTGRES_USER: ${DB_USERNAME:-finance_tracking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finance_tracking} -d ${DB_NAME:-finance_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      RAILS_ENV: production
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?RAILS_MASTER_KEY is required}
      SOLID_QUEUE_IN_PUMA: "true"
      DB_HOST: db
      DB_NAME: ${DB_NAME:-finance_tracking}
      DB_USERNAME: ${DB_USERNAME:-finance_tracking}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - app_storage:/rails/storage
      - certs:/etc/letsencrypt
      - nginx_config:/etc/nginx/conf.d
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - certs:/etc/letsencrypt
      - nginx_config:/etc/nginx/conf.d
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  app_storage:
  certs:
  nginx_config:
